# Local development services. Start with `pnpm db:up`.
# Ports are shifted (PostgreSQL 55432, Redis 56379) so they don't clash with local installs or other projects.
# Credentials are for local use only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dd
      POSTGRES_PASSWORD: dd_local_only
      POSTGRES_DB: dd_platform
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dd_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd -d dd_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:56379:6379"

volumes:
  dd_pg:
